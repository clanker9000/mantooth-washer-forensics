var t;
var wsc_t;
var tryingWSC = 1;
var waitCounter = 0;

var MAX_WAIT_TIME = 15000;
function goToWaitPage() {
  clearTimeout(t);

  } else {
  } 
}
function goToLoginUrl() {
  clearTimeout(t);
  tryingAIM = 0; 
  if( tryingWSC == 0){ 
    snsRedir("https://my.screenname.aol.com/_cqr/login/login.psp?mcState=initialized&seamless=novl&sitedomain=sns.webmail.aol.com&lang=en&locale=us&authLev=2&siteState=ver%3a1%252c0%26ac%3aWS%26at%3aSNS%26ld%3amail.aol.com%26uv%3aAOL%26lc%3aen-us%26ud%3aaol.com%26br%3aWebSuite-Prod&checkAIM=1");
  } else {
  } 
}
function tryAIM() {
  clearTimeout(wsc_t);
  tryingWSC = 0; 
  if(tryingAIM == 1){
    var timeout = '2000';
    t=setTimeout("goToLoginUrl()",timeout);
    window.defaultStatus=' ';
    window.status=' ';
  } else if(tryingAIM == 2){
	goToWaitPage();
  } else {
	goToLoginUrl();
  }
}
function continueLogin() {
  tryingWSC = 0;
  if( tryingAIM == 2 ) {
    goToWaitPage();
  } else {
    goToLoginUrl();
  }
}
wsc_t=setTimeout("continueLogin()",MAX_WAIT_TIME);
window.defaultStatus=' ';
window.status=' ';
</SCRIPT>
